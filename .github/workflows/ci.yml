name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      # A red macOS leg must never hide a red Windows leg. Windows is the
      # platform users actually have today, so its result is the one that counts
      # even while the macOS port is incomplete.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # There is deliberately no icon-generation step. build/icon.{svg,ico,png}
      # are committed, and `npm run icons` is a hand-run step for when the SVG
      # changes. See the drift guard below.

      # The app has exactly one runtime dependency and no native addons, which is
      # what makes it portable with nothing to recompile. `active-win` is the
      # obvious thing to reach for when implementing window enumeration, and it is
      # a native addon — this turns a rule someone can rationalise past into a
      # red check.
      - name: No native dependencies
        shell: bash
        run: |
          deps=$(node -e "console.log(Object.keys(require('./package.json').dependencies).sort().join(','))")
          if [ "$deps" != "ws" ]; then
            echo "Runtime dependencies changed to: $deps (expected exactly: ws)"
            echo "Adding a runtime dependency — especially a native addon — needs a discussion first."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Status flash
        run: npm run test:status-flash

      - name: Pill geometry
        run: npm run test:pill-geometry

      - name: TEMP CIM diagnostic
        run: npm run diag:cim

      - name: Interactions
        run: npm run test:interactions

      # Cowork discovery, against a fixture tree under the OS temp directory —
      # it never reads the real Claude Desktop data, so it is safe on a runner
      # that has none. The path-shape rules it covers differ per platform, so it
      # earns its place on both legs.
      - name: Cowork sessions
        run: npm run test:cowork

      # Checks BOTH platforms' contracts on whichever runner this is, including
      # the invariant that no user-controlled value is ever concatenated into an
      # argument. That one guards a command-injection path reachable from the
      # phone companion, so it must not wait for a macOS runner to be involved.
      - name: Platform contract
        run: npm run test:platform-contract

      # Covers the 0.1.x -> 0.2.0 hook marker and backup migration. Safe for CI:
      # it redirects HOME/USERPROFILE at a temp directory and asserts the redirect
      # took before touching anything.
      - name: Hook migration
        run: npm run test:hook-migration

      # Needs a real Electron and a display; both runners have one.
      - name: Tray icons
        run: npm run test:tray-icons

      - name: Orchestrator tests
        run: npm run bugs:test

      # `npm run verify` is deliberately absent: it installs and uninstalls
      # hooks in the real ~/.claude/settings.json. See CONTRIBUTING.md.

      - name: Build
        run: npm run build

  # Separate job, one runner: this compares against the base branch and has
  # nothing to do with either platform.
  icons-in-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The icons are committed rather than generated, so the one failure mode is
      # editing the SVG and forgetting to regenerate. This buys drift protection
      # without putting a rasterizer back in the build.
      - name: icon.svg changed without regenerating the rasters
        shell: bash
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- build/)
          if grep -q 'build/icon.svg' <<< "$changed" && ! grep -q 'build/icon.ico' <<< "$changed"; then
            echo "build/icon.svg changed but build/icon.ico did not — run 'npm run icons' and commit the result."
            exit 1
          fi
